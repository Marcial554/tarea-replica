<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Certus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .left {
      flex: 1;
      background-color: #202175;
      display: flex;
      flex-direction: column;
      position: relative;
      color: white;
      padding-top: 20px;
      padding-right: 30px; /* Agregado para dar espacio al texto */
    }

    .left img {
      width: 180px;
      margin: 20px;
    }

    .welcome-text {
      position: absolute;
      top: 20px; /* Cambiado para colocar el texto arriba */
      right: 20px; /* Posiciona el texto a la derecha del contenedor azul */
      text-align: center;
    }

    .welcome-text h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome-text p {
      font-size: 20px;
      font-weight: 300;
    }

    .right {
      flex: 1;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-box {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .form-box label {
      display: block;
      text-align: left;
      font-weight: bold;
      font-size: 14px;
      color: #444;
      margin-bottom: 5px;
    }

    .form-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    .form-box button {
      width: 100%;
      padding: 12px;
      background-color: #4B2C88;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-box button:hover {
      background-color: #3a2272;
    }

    .form-box .forgot {
      margin-top: 15px;
      font-size: 14px;
    }

    .form-box .forgot a {
      color: #4B2C88;
      text-decoration: none;
    }

    .form-box .forgot a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .left, .right {
        flex: none;
        width: 100%;
        height: 50%;
      }

      .form-box {
        max-width: 90%;
      }

      .left img {
        margin: 10px auto 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="left">
    <img src="https://www.certus.edu.pe/wp-content/uploads/2018/12/certus-logo-1-01-copy-3@2x.png" alt="Certus Logo">
    <div class="welcome-text">
      <h2>Bienvenido(a)</h2>
      <p>Portal Certus</p>
    </div>
  </div>
  <div class="right">
    <div class="form-box">
      <form>
        <h3>¡Hola! <br>Ingresa tus datos</h3>
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required>

        <button type="submit">Ingresar</button>
      </form>
      <div class="forgot">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
    </div>
  </div>
</body>
</html>
